<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .serif { font-family: Georgia, Cambria, 'Times New Roman', Times, serif; }
    </style>
  </defs>

  <!-- Canvas background -->
  <rect width="1200" height="630" fill="#FAF9F5" />

  <!-- Subtle architectural hairline grid -->
  <g stroke="#E7E6E0" stroke-width="1" opacity="0.6">
    <line x1="80" y1="0" x2="80" y2="630" />
    <line x1="1120" y1="0" x2="1120" y2="630" />
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="550" x2="1200" y2="550" />
  </g>

  <!-- Top bar -->
  <g transform="translate(80, 50)">
    <rect width="44" height="44" rx="10" fill="#161615" />
    <text x="22" y="28" class="mono" font-size="18" font-weight="700" fill="#FAF9F5" text-anchor="middle">RK</text>
    <circle cx="36" cy="12" r="4" fill="#D0532C" />

    <text x="64" y="28" class="mono" font-size="14" font-weight="600" fill="#73726C" letter-spacing="1.5">// SYSTEM PROFILE: DEVELOPER PORTFOLIO</text>
    <text x="1040" y="28" class="mono" font-size="13" font-weight="600" fill="#2E7D4E" text-anchor="end">● AVAILABLE FOR OPPORTUNITIES</text>
  </g>

  <!-- Main Hero Block -->
  <g transform="translate(80, 180)">
    <!-- Eyebrow -->
    <rect width="180" height="28" rx="6" fill="#F3F2EC" stroke="#E7E6E0" stroke-width="1" />
    <text x="14" y="19" class="mono" font-size="12" font-weight="600" fill="#D0532C" letter-spacing="1">SOFTWARE DEVELOPER</text>

    <!-- Name / Title -->
    <text x="0" y="105" class="sans" font-size="76" font-weight="700" fill="#161615" letter-spacing="-2">RAGIL KP</text>

    <!-- Mission Statement -->
    <text x="0" y="165" class="sans" font-size="28" font-weight="400" fill="#5C5B57">
      Building digital experiences through <tspan class="serif" font-style="italic">code</tspan>, creativity, and curiosity.
    </text>

    <!-- Sub-narrative -->
    <text x="0" y="205" class="sans" font-size="18" font-weight="400" fill="#73726C">
      Backend Systems &bull; REST APIs &bull; Level 1 IT Support &bull; Al Qusais, Dubai, UAE
    </text>
  </g>

  <!-- Bottom Tech Stack Pills -->
  <g transform="translate(80, 470)">
    <text x="0" y="0" class="mono" font-size="12" font-weight="600" fill="#73726C" letter-spacing="1.5">VERIFIED CORE CAPABILITIES:</text>
    
    <g transform="translate(0, 15)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="160" height="34" rx="8" fill="#FFFFFF" stroke="#E7E6E0" stroke-width="1" />
      <text x="80" y="22" class="mono" font-size="12" font-weight="600" fill="#161615" text-anchor="middle">Java &bull; Spring Boot</text>

      <!-- Pill 2 -->
      <rect x="175" y="0" width="145" height="34" rx="8" fill="#FFFFFF" stroke="#E7E6E0" stroke-width="1" />
      <text x="247" y="22" class="mono" font-size="12" font-weight="600" fill="#161615" text-anchor="middle">Python &bull; Django</text>

      <!-- Pill 3 -->
      <rect x="335" y="0" width="185" height="34" rx="8" fill="#FFFFFF" stroke="#E7E6E0" stroke-width="1" />
      <text x="427" y="22" class="mono" font-size="12" font-weight="600" fill="#161615" text-anchor="middle">Next.js &bull; TypeScript</text>

      <!-- Pill 4 -->
      <rect x="535" y="0" width="140" height="34" rx="8" fill="#FFFFFF" stroke="#E7E6E0" stroke-width="1" />
      <text x="605" y="22" class="mono" font-size="12" font-weight="600" fill="#161615" text-anchor="middle">Linux &bull; cPanel</text>

      <!-- Pill 5 -->
      <rect x="690" y="0" width="125" height="34" rx="8" fill="#FFFFFF" stroke="#E7E6E0" stroke-width="1" />
      <text x="752" y="22" class="mono" font-size="12" font-weight="600" fill="#161615" text-anchor="middle">MySQL &bull; SQL</text>
    </g>
  </g>

  <!-- Bottom hairline border -->
  <line x1="80" y1="580" x2="1120" y2="580" stroke="#E7E6E0" stroke-width="1" />
  <text x="80" y="605" class="mono" font-size="11" fill="#73726C">github.com/ragil-007 &bull; linkedin.com/in/ragil-raghunath</text>
  <text x="1120" y="605" class="mono" font-size="11" fill="#73726C" text-anchor="end">Dubai, UAE &bull; GST Timezone</text>
</svg>
